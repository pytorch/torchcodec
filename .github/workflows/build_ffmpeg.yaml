# Taken and adapted from torchaudio.
# Ref: https://github.com/pytorch/audio/blob/main/.github/workflows/ffmpeg.yml
# This job is not directly related to regular CI pipeline.
# It is intended to create FFmpeg binaries that we upload on S3,
# which then will be used during all the build process in CI or local.
#
# This job does not include the uploading part.
# Upload needs to be done manually, and it should be done only once
# per new major release of FFmepg.
name: Build non-GPL FFmpeg from source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/build_ffmpeg.sh
      - packaging/build_ffmpeg_arm64.bat
      - packaging/build_ffmpeg.bat
      - .github/workflows/build_ffmpeg.yaml # self reference
  schedule:
    - cron: '0 0 * * 0'  # on sunday

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:
  LGPL-Linux-x86_64:
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ["4.4.4", "5.1.4", "6.1.1", "7.0.1", "8.0", "9.0"]
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      job-name: Build
      upload-artifact: ffmpeg-lgpl-linux_x86_64-${{ matrix.ffmpeg-version }}
      repository: meta-pytorch/torchcodec
      script: |
        export FFMPEG_VERSION="${{ matrix.ffmpeg-version }}"
        export FFMPEG_ROOT="${PWD}/ffmpeg"

        packaging/build_ffmpeg.sh

        tar -cf ffmpeg.tar.gz ffmpeg/include ffmpeg/lib

        artifact_dir="${RUNNER_ARTIFACT_DIR}/$(date +%Y-%m-%d)/linux_x86_64"
        mkdir -p "${artifact_dir}"
        mv ffmpeg.tar.gz "${artifact_dir}/${FFMPEG_VERSION}.tar.gz"

  LGPL-Linux-aarch64:
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ["4.4.4", "5.1.4", "6.1.1", "7.0.1", "8.0", "9.0"]
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      job-name: Build
      upload-artifact: ffmpeg-lgpl-linux_aarch64-${{ matrix.ffmpeg-version }}
      repository: meta-pytorch/torchcodec
      runner: linux.arm64.2xlarge
      docker-image: pytorch/manylinux2_28_aarch64-builder:cpu-aarch64
      script: |
        export FFMPEG_VERSION="${{ matrix.ffmpeg-version }}"
        export FFMPEG_ROOT="${PWD}/ffmpeg"

        packaging/build_ffmpeg.sh

        tar -cf ffmpeg.tar.gz ffmpeg/include ffmpeg/lib

        artifact_dir="${RUNNER_ARTIFACT_DIR}/$(date +%Y-%m-%d)/linux_aarch64"
        mkdir -p "${artifact_dir}"
        mv ffmpeg.tar.gz "${artifact_dir}/${FFMPEG_VERSION}.tar.gz"

  LGPL-macOS:
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ["4.4.4", "5.1.4", "6.1.1", "7.0.1", "8.0", "9.0"]
    uses: pytorch/test-infra/.github/workflows/macos_job.yml@main
    with:
      job-name: Build
      upload-artifact: ffmpeg-lgpl-macos-${{ matrix.ffmpeg-version }}
      repository: meta-pytorch/torchcodec
      runner: macos-14-xlarge
      script: |
        export FFMPEG_VERSION="${{ matrix.ffmpeg-version }}"
        export FFMPEG_ROOT="${PWD}/ffmpeg"

        packaging/build_ffmpeg.sh

        tar -cf ffmpeg.tar.gz ffmpeg/include ffmpeg/lib

        artifact_dir="${RUNNER_ARTIFACT_DIR}/$(date +%Y-%m-%d)/macos_$(uname -m)"
        mkdir -p "${artifact_dir}"
        mv ffmpeg.tar.gz "${artifact_dir}/${FFMPEG_VERSION}.tar.gz"

  LGPL-Windows:
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ["4.4.4", "5.1.4", "6.1.1", "7.0.1", "8.0", "9.0"]
    uses: pytorch/test-infra/.github/workflows/windows_job.yml@main
    with:
      job-name: Build
      upload-artifact: ffmpeg-lgpl-windows_x86_64-${{ matrix.ffmpeg-version }}
      repository: meta-pytorch/torchcodec
      script: |
        export FFMPEG_VERSION="${{ matrix.ffmpeg-version }}"
        export FFMPEG_ROOT="${PWD}/ffmpeg"

        packaging/build_ffmpeg.bat

        tar -cf ffmpeg.tar.gz ffmpeg/include ffmpeg/bin

        artifact_dir="${RUNNER_ARTIFACT_DIR}/$(date +%Y-%m-%d)/windows_$(uname -m)"
        mkdir -p "${artifact_dir}"
        mv ffmpeg.tar.gz "${artifact_dir}/${FFMPEG_VERSION}.tar.gz"

  # Native Windows ARM64 counterpart of LGPL-Windows. Runs on GitHub's
  # standard `windows-11-arm` hosted runner (GA for public repos since
  # 2025-08-07) instead of pytorch/test-infra's windows_job.yml wrapper,
  # since that reusable workflow targets test-infra's own x86_64 runner
  # fleet. This job only produces a build artifact; per this workflow's
  # header comment, uploading it to the S3 bucket consumed by
  # BUILD_AGAINST_ALL_FFMPEG_FROM_S3 is a separate, manual, maintainer-only
  # step that must be done once to unblock windows_wheel.yaml's arm64 build.
  LGPL-Windows-arm64:
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ["4.4.4", "5.1.4", "6.1.1", "7.0.1", "8.0", "9.0"]
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Build FFmpeg (LGPL, decode/encode symbols only) and package artifact
        run: |
          export FFMPEG_VERSION="${{ matrix.ffmpeg-version }}"
          export FFMPEG_ROOT="${PWD}/ffmpeg"

          packaging/build_ffmpeg_arm64.bat

          tar -cf ffmpeg.tar.gz ffmpeg/include ffmpeg/bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl-windows_arm64-${{ matrix.ffmpeg-version }}
          path: ffmpeg.tar.gz
          if-no-files-found: error
          retention-days: 14
